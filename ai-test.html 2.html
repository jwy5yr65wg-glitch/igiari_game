<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>異議ありすぎる裁判。AIテスト v0.2</title><style>:root{color-scheme:dark}body{margin:0;background:#14111a;color:#f6f0dc;font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;padding:25px 16px 65px}main{max-width:700px;margin:auto}h1{font-size:25px;line-height:1.4}button,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #b8a47d}button{background:#eacb80;color:#211b13;font-weight:800;margin:8px 8px 8px 0}button:disabled{opacity:.35}select{background:#302839;color:white;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#27222d;border:1px solid #665a70;border-radius:12px;padding:15px;min-height:90px}small{color:#bfb3c8}#status{color:#f1d68f}details{margin-top:20px}#log{font-size:12px;min-height:40px}label{display:block;margin:12px 0 4px}</style></head><body><main><h1>⚖️ 異議ありすぎる裁判。<br>AI実機テスト v0.2</h1><p>前回の「Cannot fetch」を調べる修正版。モデルの設定ファイルを先に確認し、取得できない候補は選ばないようにします。<strong>4Bを優先</strong>し、使えなければ小型モデルを選べます。</p><p id="support">WebGPUを確認中…</p><label for="model">モデル（接続確認済みの候補）</label><select id="model"><option>確認中…</option></select><div><button id="load" disabled>AIを読み込む</button><button id="gen" disabled>意味不明な事件を生成</button><button id="retry">モデル一覧を再確認</button></div><p id="status">準備中…</p><small id="time"></small><pre id="out">ここにAIが考えた事件を表示します。</pre><details><summary>エラー詳細・通信診断</summary><pre id="log">診断待ち</pre></details><p><small>Wi-Fi推奨。初回は数GBの通信が必要な場合があります。モデルが配布先から取得できない、Safariのメモリが足りない、WebGPUの機能が不足する等の場合は動作しません。AI利用の従量課金はありません。</small></p></main><script type="module">
const $=id=>document.getElementById(id);let lib,engine,available=[];const log=s=>{$('log').textContent+='\n'+new Date().toLocaleTimeString()+' '+s};const status=s=>$('status').textContent=s;const rank=s=>{s=s.toLowerCase();return /qwen3.*4b/.test(s)?0:/qwen.*4b/.test(s)?1:/qwen.*3b/.test(s)?2:/qwen3.*1\.7b/.test(s)?3:/qwen.*1\.5b/.test(s)?4:/qwen.*0\.6b/.test(s)?5:9};
async function check(m){const root=m.model.replace(/\/$/,'');const url=root+'/resolve/main/mlc-chat-config.json';try{const r=await fetch(url,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j||typeof j!=='object')throw Error('設定ファイル形式不正');log('OK '+m.model_id);return true}catch(e){log('NG '+m.model_id+' : '+e.message+' ('+url+')');return false}}
async function init(){try{$('load').disabled=true;$('gen').disabled=true;status('WebGPUとモデルの配布先を確認中…');if(!navigator.gpu)throw Error('WebGPU非対応');const a=await navigator.gpu.requestAdapter();if(!a)throw Error('GPUアダプターなし');$('support').textContent='✅ WebGPU利用可能';lib=await import('https://esm.run/@mlc-ai/web-llm');const list=lib.prebuiltAppConfig.model_list.filter(m=>/qwen/i.test(m.model_id)&&/(4b|3b|1\.7b|1\.5b|0\.6b)/i.test(m.model_id)).sort((a,b)=>rank(a.model_id)-rank(b.model_id));if(!list.length)throw Error('対応候補なし');$('log').textContent='';available=[];for(const m of list.slice(0,18)){status('配布先を確認中 '+(available.length+1)+'件利用可能 / '+m.model_id);if(await check(m))available.push(m);if(available.length>=5)break}const select=$('model');select.innerHTML='';for(const m of available){const o=document.createElement('option');o.value=m.model_id;o.textContent=m.model_id;select.appendChild(o)}if(!available.length)throw Error('取得できるモデルがありません。通信診断を確認してください。');$('load').disabled=false;status('接続確認完了。モデルを選んで「AIを読み込む」を押してね。');}catch(e){status('準備失敗: '+e.message);log('INIT ERROR '+e.stack)}}
$('retry').onclick=init;
$('load').onclick=async()=>{try{$('load').disabled=true;$('gen').disabled=true;status('モデル読み込み中…（初回は長時間かかる場合があります）');const t=performance.now();engine=await lib.CreateMLCEngine($('model').value,{initProgressCallback:p=>{status('読み込み中: '+(p.text||Math.round((p.progress||0)*100)+'%'))}});$('time').textContent='読み込み '+Math.round((performance.now()-t)/1000)+'秒';status('準備完了！事件を生成できます');$('gen').disabled=false;}catch(e){status('読み込み失敗: '+e.message);log('LOAD ERROR '+(e.stack||e.message));$('load').disabled=false}};
$('gen').onclick=async()=>{try{$('gen').disabled=true;$('out').textContent='AIが事件を考えています…';status('生成中…');const t=performance.now();const r=await engine.chat.completions.create({messages:[{role:'system',content:'日本語の不条理裁判コメディ作家。短く、具体的で、予想外の因果関係を重視。普通の刑罰は禁止。日本語のみ。'},{role:'user',content:'裁判ゲーム用に意味不明で笑える事件を1件創作。スプーン田中、冷蔵庫レイゾウ、宇宙人グレイ、モアイ社長、シャウティーチキン、プリンから登場人物を選ぶ。事件名、被告人、奇妙な容疑、証人の証言、意味不明な刑4種類を日本語で。'}],temperature:1.1,max_tokens:500});$('out').textContent=r.choices?.[0]?.message?.content||'空の回答';$('time').textContent+=' / 生成 '+Math.round((performance.now()-t)/1000)+'秒';status('生成完了！');}catch(e){status('生成失敗: '+e.message);log('GENERATE ERROR '+(e.stack||e.message))}finally{$('gen').disabled=false}};
init();
</script></body></html>
