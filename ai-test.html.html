<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>異議ありすぎる裁判。AI実機テスト</title><style>body{background:#14111a;color:#f6f0dc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:24px 16px 60px;line-height:1.65}main{max-width:720px;margin:auto}h1{font-size:25px}button,select{font-size:16px;padding:13px;border-radius:10px;border:1px solid #b8a47d}button{background:#eacb80;color:#211b13;font-weight:800;margin:8px 8px 8px 0}button:disabled{opacity:.4}select{background:#302839;color:white;max-width:100%;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#27222d;border:1px solid #665a70;padding:15px;border-radius:12px;min-height:100px}small{color:#bfb3c8}#status{color:#f1d68f}</style></head><body><main><h1>⚖️ 異議ありすぎる裁判。<br>AI即興エンジン実機テスト</h1><p>iPhone SafariでAIを直接動かす無料テスト。最初は4B級を選択。モデル一覧はライブラリが公開する対応モデルから取得するため、該当モデルがなければ別の候補を選んでください。</p><p id="support">WebGPU確認中…</p><label for="model">AIモデル</label><select id="model"><option>モデル一覧を読み込み中…</option></select><div><button id="load" disabled>AIを読み込む</button><button id="gen" disabled>意味不明な事件を生成</button></div><p id="status">準備中</p><small id="time"></small><pre id="out">ここにAIの作った事件が表示されます。</pre><small>注意：初回は数GBのダウンロードが必要なモデルがあります。Wi-Fi推奨。Safariのメモリ不足やWebGPU非対応の場合は動作しません。モデルの重みは端末のブラウザにキャッシュされる場合があります。端末内推論のためAPI料金は発生しません。</small></main><script type="module">
const $=id=>document.getElementById(id);let webllm,engine,started;const status=t=>$('status').textContent=t;
try{if(!navigator.gpu)throw Error('WebGPUが利用できません。Safari/iOSの対応状況を確認してください。');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('GPUアダプターを取得できません');$('support').textContent='✅ WebGPU利用可能';webllm=await import('https://esm.run/@mlc-ai/web-llm');const list=webllm.prebuiltAppConfig.model_list;const candidates=list.filter(x=>/qwen/i.test(x.model_id)&&/(4b|3b|1\.7b|1\.5b|0\.6b)/i.test(x.model_id));const sorted=candidates.sort((a,b)=>rank(a)-rank(b));function rank(x){let s=x.model_id.toLowerCase();return s.includes('4b')?0:s.includes('3b')?1:s.includes('1.7b')?2:s.includes('1.5b')?3:4}const options=sorted.length?sorted:list.filter(x=>/3b|4b|1\.5b|1\.7b/i.test(x.model_id));$('model').innerHTML='';for(const m of options){const o=document.createElement('option');o.value=m.model_id;o.textContent=m.model_id;$('model').append(o)}if(!options.length)throw Error('利用可能なモデル候補が見つかりません');$('load').disabled=false;status('モデルを選んで「AIを読み込む」を押してください');}catch(e){$('support').textContent='⚠️ '+e.message;status('初期化できませんでした');}
$('load').onclick=async()=>{try{$('load').disabled=true;status('AIを読み込み中… 初回は時間がかかります');started=performance.now();engine=await webllm.CreateMLCEngine($('model').value,{initProgressCallback:p=>{status('読み込み中: '+(p.text||Math.round((p.progress||0)*100)+'%'))}});status('準備完了！事件を生成できます');$('time').textContent='読み込み: '+Math.round((performance.now()-started)/1000)+'秒';$('gen').disabled=false;}catch(e){status('読み込み失敗: '+e.message);$('load').disabled=false;}};
$('gen').onclick=async()=>{try{$('gen').disabled=true;$('out').textContent='AIが事件を考えています…';status('生成中');const t=performance.now();const result=await engine.chat.completions.create({messages:[{role:'system',content:'あなたは日本語の不条理裁判コメディ作家です。短く、具体的で、予想外の因果関係を重視してください。常識的な刑罰は禁止。出力は日本語のみ。'},{role:'user',content:'架空の裁判ゲームのために、完全に意味不明で笑える事件を一件だけ即興で創作してください。登場人物はスプーン田中、冷蔵庫レイゾウ、宇宙人グレイ、モアイ社長、シャウティーチキン、プリンから選ぶ。次の形式で300〜450文字程度：事件名／被告人／容疑（具体的で奇妙）／証人の証言／選べる意味不明な刑を4種類。ありきたりな内容は避ける。'}],temperature:1.15,max_tokens:650});$('out').textContent=result.choices?.[0]?.message?.content||'生成結果が空でした';$('time').textContent+=' / 生成: '+Math.round((performance.now()-t)/1000)+'秒';status('生成完了');}catch(e){status('生成失敗: '+e.message)}finally{$('gen').disabled=false}};
</script></body></html>
