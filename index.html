<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151017"><title>異議ありすぎる裁判。試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f6e9d5;background:#100e13}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#47302a,#120e13 75%);min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35}.app{max-width:760px;margin:auto;padding:12px 12px 28px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.brand{font-size:21px;font-weight:900;letter-spacing:.04em;color:#f4d28a;text-shadow:0 2px 3px #000}.tiny{font-size:11px;color:#d5bd99}.chip{border:1px solid #aa8853;background:#211a20;border-radius:8px;padding:7px 9px;font-size:12px}.court{position:relative;height:min(52vw,355px);min-height:235px;overflow:hidden;border:3px solid #ac8350;border-radius:15px;background:linear-gradient(0deg,#3b2119 0 20%,transparent 20%),repeating-linear-gradient(90deg,#3d251e 0 17px,#4c2d23 17px 33px,#301d1a 33px 36px);box-shadow:0 15px 40px #0008,inset 0 0 70px #0009}.court:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 10%,#ffdf9555,transparent 65%);pointer-events:none}.emblem{position:absolute;left:50%;top:4%;transform:translateX(-50%);border:2px solid #b38b4d;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:30px;background:#38241b}.stand{position:absolute;bottom:22%;border:2px solid #a87948;border-radius:8px 8px 2px 2px;background:linear-gradient(90deg,#3e241a,#86512f,#42261d);box-shadow:0 8px 0 #2a1612}.judge-stand{width:37%;height:31%;left:31.5%;bottom:26%}.witness-stand{width:22%;height:22%;left:2%}.defendant-stand{width:22%;height:22%;right:20%}.prosecutor-stand{width:17%;height:16%;right:1%;bottom:20%}.actor{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:end;transform-origin:bottom center;transition:transform .24s,filter .24s;z-index:2}.actor .face{font-size:clamp(37px,9vw,82px);line-height: splay:grid;grid-template-columns:1fr;gap:8px}.item{background:#29232a;border:1px solid #6b5650;padding:12px;border-radius:9px;text-align:left;color:#fff}.item small{display:block;color:#c7b7a5;margin-top:5px}.meta{display:flex;justify-content:space-between;font-size:12px;color:#d0b99b;margin:8px 2px}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#080408c9;padding:20px}.overlay.show{display:flex;animation:flash .55s}.objection{font-size:clamp(54px,13vw,105px);font-weight:1000;color:#fff;transform:rotate(-9deg);text-shadow:5px 5px 0 #9b111c,-5px -4px 0 #9b111c,0 0 35px #e43c39;animation:pop .6s}.verdict{text-align:center;padding:20px;border:3px double #d4aa66;border-radius:16px;background:#1d1720}.verdict h1{font-size:60px;margin:8px;color:#f4c87b}.hidden{display:none!important}.footer{margin:14px 2px;color:#b6a18d;font-size:11px;line-height:1.6}.pill{display:inline-block;border:1px solid #96724e;border-radius:20px;padding:4px 8px;font-size:11px;margin:2px}.title-screen{text-align:center;padding:24px 12px}.title-screen h1{font-size:clamp(30px,8vw,54px);line-height:1.2;color:#e8c17a;text-shadow:3px 4px #561b23}.title-screen p{line-height:1.8;color:#d8c9ba}.result-detail{line-height:1.8;font-size:14px}.focus{filter:brightness(1.3)}@keyframes shake{0%,100%{translate:0 0}25%{translate:-7px 2px}50%{translate:8px -2px}75%{translate:-4px 3px}}@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.25) rotate(-9deg)}100%{transform:scale(1) rotate(-9deg)}}@keyframes flash{0%{background:#fff}100%{background:#080408c9}}@media(min-width:650px){.court{height:350px}.actor .face{font-size:75px}}
.history{margin-top:10px;border:1px solid #755b43;border-radius:10px;background:#211b23;padding:10px}.history summary{cursor:pointer;color:#e8c17a;font-weight:800}.history-entry{border-top:1px solid #493a3a;padding:8px 0;font-size:13px;line-height:1.6;white-space:pre-wrap}.history-entry b{color:#e8c17a;display:block}.continue-note{color:#e8c17a;font-size:12px;margin:8px 0;text-align:center}</style></head><body><div class="app"><div class="top"><div><div class="brand">異議ありすぎる裁判。</div><div class="tiny" id="subtitle">法廷は真剣。事件は異常。</div></div><div class="chip" id="record">勝訴 0 / 裁判 0</div></div><section id="home" class="title-screen"><div style="font-size:80px">⚖️🦆</div><h1>異議ありすぎる<br>裁判。</h1><p>あなたは弁護士。<br>被告人は、たぶん人間ではない。<br>証拠を調べ、証言を崩し、無罪を勝ち取れ。</p><button class="btn red" style="width:100%" onclick="newCase()">開廷する！</button><p class="tiny">10事件 × 3つの真相 × 分岐する判決<br>20キャラクター / セーブ自動保存</p></section><main id="game" class="hidden"><div class="meta"><span id="caseTitle">CASE 001</span><span id="turnText">調査</span></div><div class="court" id="court"><div class="emblem">⚖</div><div class="stand judge-stand"></div><div class="stand witness-stand"></div><div class="stand defendant-stand"></div><div class="stand prosecutor-stand"></div><div class="actor judge" id="judge"><div class="face">🦆</div><div class="name">鴨川裁判長</div></div><div class="actor witness" id="witness"><div class="face">🥄</div><div class="name">スプーン田中</div></div><div class="actor defendant" id="defendant"><div class="face">🧊</div><div class="name">冷蔵庫レイゾウ</div></div><div class="actor prosecutor" id="prosecutor"><div class="face">🍌</div><div class="name">黄島検事</div></div><div class="desk"><div class="paper"></div><div class="gavel">📜</div><div class="paper"></div></div></div><div class="dialog"><div class="speaker" id="speaker">裁判官</div><div class="line" id="dialog">開廷します。</div></div><details class="history" id="historyPanel"><summary>📜 会話履歴を読む</summary><div id="historyEntries"></div></details><div class="stats"><div class="stat">裁判官の納得度 <b id="convinceVal">20</b>%<div class="bar"><div class="fill green" id="convinceBar" style="width:20%"></div></div></div><div class="stat">弁護士の信用 <b id="trustVal">70</b>%<div class="bar"><div class="fill" id="trustBar" style="width:70%"></div></div></div></div><div id="playArea"></div></main><div class="footer">※試作版。法廷とキャラクターは仮の絵文字素材です。事件は架空のコメディで、現実の法律を再現するものではありません。</div></div><div class="overlay" id="overlay"><div class="objection">異議あり！</div></div><script>
'use strict';
const cast={duck:['鴨川裁判長','🦆'],lion:['獅堂裁判長','🦁'],daruma:['ダルマ裁判官','🔴'],banana:['黄島検事','🍌'],reika:['氷室レイカ','👩🏻‍⚖️'],fridge:['冷蔵庫レイゾウ','🧊'],spoon:['スプーン田中','🥄'],bread:['食パンのゴン','🍞'],toilet:['トイレ様','🚽'],eye:['目玉CEO','👁️'],moai:['モアイ社長','🗿'],ramen:['カップ麺氏','🍜'],tuna:['マグロの大将','🐟'],alien:['宇宙人グレイ','👽'],ufo:['UFO','🛸'],mushroom:['シイタケ・トリップ','🍄'],cash:['札束くん','💵'],outlet:['コンセント氏','🔌'],brain:['脳みそ博士','🧠'],chicken:['シャウティーチキン','🐔']};
const cases=[
{title:'消えたプリン事件',def:'fridge',wit:'spoon',intro:'昨夜、プリンが消えました。冷蔵庫が食べた疑いで起訴されています。',claims:['私は冷蔵庫がプリンを食べるのを見ました！','犯行時刻は23時ちょうどでした！','犯人の手にはスプーンが握られていました！'],evidence:[['汚れたスプーン','柄にプリンと別の食材の痕跡がある'],['監視カメラ','23時に台所へ入った影が映っている'],['購入レシート','プリンは冷蔵庫の所有物ではなかった']],truths:[['スプーンが味見を繰り返し、プリンを食べ尽くしていた','汚れたスプーン',0],['プリンは持ち主が持ち出しており、窃盗は発生していなかった','監視カメラ',1],['冷蔵庫が扉を開け、別の者の犯行を手助けしていた','購入レシート',2]]},
{title:'トイレ、使用拒否事件',def:'toilet',wit:'outlet',intro:'トイレが突然「本日休業」を宣言しました。',claims:['トイレは一切動こうとしませんでした！','電気は正常に供給されていました！','休業届なんて存在しません！'],evidence:[['停電記録','午前中に短い停電があった'],['使用履歴','使用者の記録が不自然に空白'],['有給申請書','トイレの署名がある謎の書類']],truths:[['停電で電子制御が停止していた','停電記録',1],['利用者が別のトイレに入っていた','使用履歴',0],['トイレは正式に有給休暇を申請していた','有給申請書',2]]},
{title:'食パン放火未遂事件',def:'bread',wit:'ramen',intro:'食パンが自分をトースターで焼いた罪に問われています。',claims:['焦げた匂いが法廷まで届きました！','トースターの温度は最高設定でした！','パン本人が火をつけたんです！'],evidence:[['焦げ跡','表面だけに焼き色がついている'],['温度ダイヤル','最高設定から動かした跡がある'],['注文票','「よく焼き」の注文が書かれている']],truths:[['通常の調理であり放火ではなかった','焦げ跡',0],['カップ麺氏が温度を変更していた','温度ダイヤル',1],['食パンは注文通り焼かれただけだった','注文票',2]]},
{title:'目玉CEOの盗撮疑惑',def:'eye',wit:'moai',intro:'巨大な目玉が「見ただけで盗撮扱いされた」と訴えています。',claims:['目玉CEOはずっとこちらを見ていました！','現場にはカメラがありました！','写真が保存されていたはずです！'],evidence:[['防犯映像','カメラを持つ別の影が映っている'],['端末ログ','目玉CEOの端末に撮影履歴はない'],['隠しレンズ','現場の置物からレンズが発見された']],truths:[['目玉CEOはただ見ていただけだった','端末ログ',2],['別人が現場で撮影していた','防犯映像',1],['目玉CEOは隠し装置を操作していた','隠しレンズ',0]]},
{title:'マグロの無断遊泳事件',def:'tuna',wit:'spoon',intro:'市民プールでマグロが泳いだとして訴えられました。',claims:['マグロは水の中を移動していました！','入場券を買っていません！','プールの床に足跡がありません！'],evidence:[['監視映像','マグロが台車に乗せられている'],['入場券','団体用の入場券がある'],['床の跡','車輪の跡がプールサイドに続く']],truths:[['マグロは台車で運搬されていた','監視映像',0],['団体入場が許可されていた','入場券',1],['マグロはプールの外を移動していた','床の跡',2]]},
{title:'UFOによる牛の誘拐事件',def:'ufo',wit:'alien',intro:'牛が空に吸い込まれたと通報がありました。',claims:['牛は自分の意思で動いていません！','宇宙船に乗車券はありません！','操縦者は被告人のUFOです！'],evidence:[['乗車券','牛の名前で発券されている'],['光線記録','吸引光線が使用された記録'],['操縦日誌','操縦者の署名がグレイになっている']],truths:[['牛は自主的に宇宙旅行に出た','乗車券',1],['UFOが牛を無断で吸い上げた','光線記録',0],['グレイが無断で操縦した','操縦日誌',2]]},
{title:'3分で完成しなかった事件',def:'ramen',wit:'outlet',intro:'3分待ったのに麺が硬い。カップ麺氏が訴えられました。',claims:['お湯は沸騰していました！','時計は正確でした！','3分たてば必ず完成するはずです！'],evidence:[['湯温記録','注いだ湯は45度だった'],['時計の履歴','タイマーは途中で停止していた'],['商品表示','「熱湯3分」と記載されている']],truths:[['お湯がぬるすぎた','湯温記録',0],['時計が止まっていた','時計の履歴',1],['調理条件が満たされていなかった','商品表示',2]]},
{title:'脳みそ無断使用事件',def:'brain',wit:'cash',intro:'脳みそ博士が他人のアイデアを勝手に考えた疑いです。',claims:['博士は私のアイデアを知っていました！','研究ノートは後から書かれました！','アイデアには所有者がいます！'],evidence:[['思考記録','発想の時刻が記録されている'],['研究ノート','以前から似た研究がある'],['請求書','アイデア使用料の請求日が発想前になっている']],truths:[['同じ発想を偶然思いついていた','研究ノート',0],['博士は先に発想していた','思考記録',1],['請求書そのものが偽造されていた','請求書',2]]},
{title:'叫び声騒音事件',def:'chicken',wit:'moai',intro:'深夜3時に絶叫が響きました。チキンは「押された」と主張。',claims:['チキンが自分で叫びました！','現場には誰もいませんでした！','叫び声はその場で発生しました！'],evidence:[['音声波形','同じ波形が繰り返されている'],['指紋','チキンの背中に別人の指紋'],['防犯映像','モアイ社長がチキンを押している']],truths:[['誰かが録音を再生していた','音声波形',2],['第三者がチキンを押した','指紋',0],['モアイ社長が押していた','防犯映像',1]]},
{title:'裁判官、消失事件',def:'alien',wit:'eye',intro:'開廷直前に裁判官が消えました。グレイに誘拐疑惑。',claims:['裁判官は光に包まれて消えました！','木槌だけが残されました！','裁判官は確かに存在していました！'],evidence:[['木槌','持ち手に裁判官の指紋がない'],['監視記録','UFOが法廷上空を通過'],['謎の辞表','裁判官の筆跡で退職願がある']],truths:[['UFOが裁判官を連れ去った','監視記録',1],['裁判官は自ら失踪していた','謎の辞表',2],['裁判官の存在が捏造されていた','木槌',0]]}
];
const $=id=>document.getElementById(id);let state=null;let saved={wins:0,plays:0,seen:[]};try{saved={...saved,...JSON.parse(localStorage.getItem('igiari_v1')||'{}')}}catch{};updateRecord();
function updateRecord(){$('record').textContent=`勝訴 ${saved.wins} / 裁判 ${saved.plays}`}
function pick(a){return a[Math.floor(Math.random()*a.length)]}function save(){try{localStorage.setItem('igiari_v1',JSON.stringify(saved))}catch{}}
function setActor(role,id){const [name,emoji]=cast[id];const el=$(role);el.querySelector('.face').textContent=emoji;el.querySelector('.name').textContent=name;el.classList.remove('panic','active')}
function speak(who,line,focus){$('speaker').textContent=who;$('dialog').textContent=line;const entries=$('historyEntries');if(entries){const item=document.createElement('div');item.className='history-entry';const name=document.createElement('b');name.textContent=who;const content=document.createElement('span');content.textContent=line;item.append(name,content);entries.append(item)}document.querySelectorAll('.actor').forEach(e=>e.classList.remove('active'));if(focus)$(focus).classList.add('active')}
function updateStats(){$('convinceVal').textContent=state.convince;$('trustVal').textContent=state.trust;$('convinceBar').style.width=state.convince+'%';$('trustBar').style.width=state.trust+'%'}
function btn(text,fn,style=''){const b=document.createElement('button');b.className='btn '+style;b.textContent=text;b.addEventListener('click',fn);return b}function area(){const el=$('playArea');el.replaceChildren();return el}function section(title){const x=document.createElement('div');x.className='label';x.textContent=title;return x}
function newCase(){const index=Math.floor(Math.random()*cases.length);const c=cases[index];state={index,c,truth:Math.floor(Math.random()*3),judge:pick(['duck','lion','daruma']),prosecutor:pick(['banana','reika']),phase:'investigate',evidence:[],claim:0,turn:0,convince:20,trust:75,correct:0,bluffs:0,discovered:false};$('home').classList.add('hidden');$('game').classList.remove('hidden');$('historyEntries').replaceChildren();$('historyPanel').open=false;$('caseTitle').textContent=`CASE ${String(index+1).padStart(3,'0')} — ${c.title}`;setActor('judge',state.judge);setActor('prosecutor',state.prosecutor);setActor('defendant',c.def);setActor('witness',c.wit);speak('事件概要',c.intro,'defendant');updateStats();renderInvestigation()}
function renderInvestigation(){state.phase='investigate';$('turnText').textContent=`証拠調査 ${state.evidence.length}/3`;const el=area();el.append(section('調査する証拠を選ぼう（最大3つ）'));const list=document.createElement('div');list.className='items';state.c.evidence.forEach((e,i)=>{const b=document.createElement('button');b.className='item';b.disabled=state.evidence.includes(i);b.innerHTML=`🔎 ${e[0]}<small>${state.evidence.includes(i)?'調査済み':'タップして調べる'}</small>`;b.onclick=()=>{state.evidence.push(i);speak('調査メモ',e[1]);renderInvestigation()};list.append(b)});el.append(list);const a=document.createElement('div');a.className='actions';a.append(btn('証人尋問を始める',startTrial,'red full'));el.append(a)}
function startTrial(){state.phase='trial';state.claim=0;state.turn=0;showClaim()}
function showClaim(){if(state.phase!=='trial')return;$('turnText').textContent=`証人尋問 ${state.turn}/6`;speak(cast[state.c.wit][0],state.c.claims[state.claim],'witness');renderTrial()}
function renderTrial(){const el=area();el.append(section('証言をどう攻める？'));const a=document.createElement('div');a.className='actions';a.append(btn('異議あり！',objection,'red'),btn('ゆさぶる',press),btn('証拠を突きつける',showEvidence),btn('ハッタリ',bluff),btn('次の証言 ▶',()=>{state.claim=(state.claim+1)%3;showClaim()},'full'));el.append(a)}
function objection(){const ov=$('overlay');ov.classList.add('show');if(navigator.vibrate)navigator.vibrate([40,30,80]);setTimeout(()=>{ov.classList.remove('show');showEvidence()},680)}
function showEvidence(){const el=area();el.append(section('どの証拠を突きつける？'));const list=document.createElement('div');list.className='items';state.evidence.forEach(i=>{const e=state.c.evidence[i];const b=document.createElement('button');b.className='item';b.textContent='📁 '+e[0];b.onclick=()=>present(i);list.append(b)});el.append(list);const a=document.createElement('div');a.className='actions';a.append(btn('尋問に戻る',renderTrial,'full'));el.append(a)}
function modify(c,t){state.convince=Math.max(0,Math.min(100,state.convince+c));state.trust=Math.max(0,Math.min(100,state.trust+t));updateStats();if(state.trust<=0){end('退廷命令');return true}if(state.convince>=85){end(state.correct?'逆転無罪':'無罪');return true}if(state.turn>=6){end(state.convince>=60?'無罪':'有罪');return true}return false}
function nextAction(){state.turn++;const el=area();const note=document.createElement('div');note.className='continue-note';note.textContent='今のセリフは「次へ」を押すまで消えません。';el.append(note);el.append(btn('セリフを読んだ → 次へ',()=>{if(state.phase!=='trial')return;$('witness').classList.remove('panic');if(state.turn>=6){end(state.convince>=65?'無罪':'有罪')}else{showClaim()}},'gold full'))}
function present(i){const truth=state.c.truths[state.truth];const right=state.c.evidence[i][0]===truth[1]&&state.claim===truth[2];if(right){state.correct++;state.discovered=true;$('witness').classList.add('panic');speak(cast[state.c.wit][0],`なっ……その「${truth[1]}」は！ どうしてそれを……！？`,'witness');if(!modify(48,12))nextAction()}else{speak(cast[state.prosecutor][0],'弁護人、その証拠と今の証言は関係ありませんね。','prosecutor');if(!modify(-3,-18))nextAction()}}
function press(){const line=state.c.claims[state.claim];speak(cast[state.c.wit][0],`えっ、詳しく？ ……${line.replace('！','……')} これ以上は聞かないでください！`,'witness');if(!modify(9,-2))nextAction()}
function bluff(){state.bluffs++;const strong=state.judge==='lion'||(state.judge==='duck'&&state.turn%2===0);$('witness').classList.add('panic');speak('あなた（弁護士）',pick(['そもそも、被告人に人権はあるんですか！？','その証言、昨日のあなたにも言えますか！？','証人が証人である証拠を出してください！','この法廷そのものが証拠です！！']));if(!modify(strong?32:15,strong?-12:-23))nextAction()}
function end(kind){if(state.phase==='result')return;state.phase='result';saved.plays++;if(kind==='無罪'||kind==='逆転無罪')saved.wins++;const key=state.index+'-'+state.truth+'-'+kind;if(!saved.seen.includes(key))saved.seen.push(key);save();updateRecord();$('turnText').textContent='判決';const truth=state.c.truths[state.truth];const reason=kind==='退廷命令'?'弁護人の信用が尽き、法廷から退廷を命じられた。':kind==='有罪'?'弁護は届かず、被告人は有罪とされた。':state.discovered?`真相が判明。${truth[0]}。`:`裁判官は弁護人の勢いに押され、無罪を言い渡した。`;speak(cast[state.judge][0],`判決！ ${kind}！ ${reason}`,'judge');const el=area();const v=document.createElement('div');v.className='verdict';const title=document.createElement('h1');title.textContent=kind;v.append(title);const desc=document.createElement('div');desc.className='result-detail';desc.textContent=`事件：${state.c.title}\n真相：${truth[0]}\n判決理由：${reason}`;desc.style.whiteSpace='pre-line';v.append(desc);const note=document.createElement('p');note.className='tiny';note.textContent=`発見した結末 ${saved.seen.length}種類 / 今回の信用 ${state.trust}%`;v.append(note);el.append(v);const a=document.createElement('div');a.className='actions';a.append(btn('次の事件へ',newCase,'red'),btn('結果を共有',()=>{const text=`異議ありすぎる裁判。\n${state.c.title}\n判決：${kind}\n${reason}`;if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('結果をコピーしました')).catch(()=>alert(text));else alert(text)}));el.append(a)}
</script></body></html>
